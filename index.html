    <div id="google_translate_element" style="display:none; visibility:hidden; height:0; width:0; overflow:hidden;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,ar,ur,hi,ru,fr,zh-CN,fa,tl,de,it,es,tr,bn,ml,ta,pa,id',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
